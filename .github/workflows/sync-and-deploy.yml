name: Sync Esri docs and deploy to Cloudflare

on:
  schedule:
    - cron: '17 19 * * *' # daily, 03:17 Taiwan time
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Pages to check against doc.esri.com (1-15)'
        required: false
        default: '5'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync changed pages from doc.esri.com
        if: github.event_name != 'push'
        run: |
          node -e "const s=require('./data/sync-state.json');console.log(JSON.stringify(s.overrides))" > /tmp/overrides-before.json
          npm run sync -- "${{ github.event.inputs.batch_size || '5' }}"
          node -e "const s=require('./data/sync-state.json');console.log(JSON.stringify(s.overrides))" > /tmp/overrides-after.json

      - name: Commit refreshed pages
        if: github.event_name != 'push'
        run: |
          # Commit only when page content changed, so failed or no-op runs don't add daily commits.
          if cmp -s /tmp/overrides-before.json /tmp/overrides-after.json; then
            echo "No page content changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sync-state.json
          git commit -m "chore(sync): refresh pages from doc.esri.com"
          git push

      - run: npm run lint
      - run: npm test

      - name: Build Worker data and frontend
        run: npm run build:cf

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload corpus and bundles to R2
        if: steps.secrets.outputs.ready == 'true'
        run: npm run upload:r2

      - name: Deploy Worker
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy
